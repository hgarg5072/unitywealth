<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnityWealth</title>
    <meta name="description" content="Cross-border investment aggregator for families with drift analysis and portfolio sync." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/site.webmanifest?v=5" />
    <meta property="og:title" content="UnityWealth" />
    <meta property="og:description" content="Cross-border investment aggregator for families with drift analysis and portfolio sync." />
    <meta property="og:image" content="https://unitywealth.up.railway.app/icon-512.png?v=5" />
    <meta name="theme-color" content="#ffffff" id="uw-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UnityWealth" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('uw_theme') || 'light';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('uw-theme-color');
            if (meta) meta.setAttribute('content', '#020617');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
